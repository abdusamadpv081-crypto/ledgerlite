name: Bug report
description: Report a reproducible defect with enough evidence to investigate safely.
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the customer or operational impact. Do not include customer data, credentials, or payment information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include app version, browser/device, safe logs, screenshots, or correlation ID. Redact sensitive data.
  - type: checkboxes
    id: severity
    attributes:
      label: Impact
      options:
        - label: This may affect accounting integrity, a posted financial record, or tenant isolation.
        - label: This may affect offline POS durability or duplicate sync handling.
        - label: This may expose sensitive information or indicate a security issue.
