services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerlite
      POSTGRES_USER: ledgerlite
      POSTGRES_PASSWORD: ledgerlite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
